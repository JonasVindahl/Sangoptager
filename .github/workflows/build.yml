name: Byg Windows-app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # krævet for at kunne oprette releases

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installér afhængigheder
        run: pip install -e ".[dev,build]"

      # ffmpeg genbruges mellem kørsler, så en udefrakommende nedetid hos
      # udgiveren ikke kan blokere et release
      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: resources/ffmpeg.exe
          key: ffmpeg-win64-v1

      - name: Hent ffmpeg (bundles i appen)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $gyan = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $btbn = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"

          function Get-WithRetry($url, $out) {
            for ($i = 1; $i -le 3; $i++) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing -TimeoutSec 180
                return $true
              } catch {
                Write-Warning "Forsøg $i på $url mislykkedes: $_"
                if ($i -lt 3) { Start-Sleep -Seconds (10 * $i) }
              }
            }
            return $false
          }

          # Primær kilde, ellers GitHub-hostet reserve (samme vært som CI)
          if (Get-WithRetry $gyan "ffmpeg.zip") {
            $source = "gyan"
          } elseif (Get-WithRetry $btbn "ffmpeg.zip") {
            $source = "btbn"
            Write-Warning "gyan.dev svarede ikke - brugte reservekilden BtbN"
          } else {
            throw "Kunne ikke hente ffmpeg fra nogen kilde"
          }

          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "ffmpeg SHA256 ($source): $actual"

          # Verificér mod udgiverens egen checksum, når den findes. Mangler
          # den, stopper vi ikke bygningen - hashen står i loggen ovenfor.
          if ($source -eq "gyan") {
            try {
              Invoke-WebRequest -Uri "$gyan.sha256" -OutFile ffmpeg.zip.sha256 -UseBasicParsing -ErrorAction Stop
            } catch {
              Write-Warning "Kunne ikke hente checksum - springer verifikation over: $_"
            }
            if (Test-Path ffmpeg.zip.sha256) {
              $expected = (Get-Content ffmpeg.zip.sha256 -Raw).Trim().Split()[0].ToLower()
              if ($actual -ne $expected) {
                throw "ffmpeg-checksum passer ikke: forventet $expected, fik $actual"
              }
              Write-Host "ffmpeg-checksum verificeret OK"
            }
          }

          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          # De to kilder pakker forskelligt - find exe'en hvor den nu ligger
          $exe = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe blev ikke fundet i arkivet" }
          Copy-Item $exe.FullName resources\

      - name: Verificér ffmpeg
        shell: pwsh
        run: |
          if (-not (Test-Path resources\ffmpeg.exe)) { throw "resources\ffmpeg.exe mangler" }
          resources\ffmpeg.exe -version | Select-Object -First 1

      - name: Kør tests
        run: pytest tests/ -q

      - name: Generér exe-ikon
        run: python scripts/make_icon.py resources/app.ico

      - name: Byg med PyInstaller
        run: pyinstaller build.spec

      - name: Røgtest af den byggede exe
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\Sangoptager\Sangoptager.exe")) { throw "Sangoptager.exe mangler" }
          if (-not (Test-Path "dist\Sangoptager\ffmpeg.exe") -and -not (Test-Path "dist\Sangoptager\_internal\ffmpeg.exe")) { throw "ffmpeg.exe blev ikke bundlet" }

      - name: Upload som artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sangoptager-windows
          path: dist/Sangoptager/
          if-no-files-found: error

      # Releaset styres af __version__ i koden: bump versionen, push til main,
      # så laver workflow'en tag og release selv. Findes releaset allerede,
      # springes det over, så almindelige main-push ikke rører noget.
      - name: Aflæs version
        id: version
        shell: pwsh
        run: |
          $m = Select-String -Path sangoptager\__init__.py -Pattern '__version__\s*=\s*"([^"]+)"'
          if (-not $m) { throw "Kunne ikke aflæse __version__" }
          $tag = "v" + $m.Matches[0].Groups[1].Value
          "tag=$tag" | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT
          Write-Host "Version i koden: $tag"

      - name: Findes releaset allerede?
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.version.outputs.tag }}" --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          $exists = if ($LASTEXITCODE -eq 0) { "true" } else { "false" }
          "exists=$exists" | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT
          Write-Host "Release findes i forvejen: $exists"
          # gh returnerer 1 når releaset ikke findes — det er et gyldigt svar
          # her, ikke en fejl, og må ikke vælte trinnet
          exit 0

      - name: Zip til release + checksum
        if: steps.existing.outputs.exists == 'false'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Sangoptager -DestinationPath Sangoptager-windows.zip
          # Appens selv-opdatering verificerer zippen mod denne fil
          $hash = (Get-FileHash Sangoptager-windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Sangoptager-windows.zip" | Out-File -Encoding ascii Sangoptager-windows.zip.sha256
          Get-Content Sangoptager-windows.zip.sha256

      - name: Opret release
        if: steps.existing.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            Sangoptager-windows.zip
            Sangoptager-windows.zip.sha256
